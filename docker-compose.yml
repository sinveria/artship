services:
  postgres:
    image: postgres:17-alpine
    container_name: artship-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: artship
      POSTGRES_USER: artship
      POSTGRES_PASSWORD: artship_local_password
      TZ: Europe/Moscow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artship -d artship"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artship-backend
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/artship
      SPRING_DATASOURCE_USERNAME: artship
      SPRING_DATASOURCE_PASSWORD: artship_local_password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_H2_CONSOLE_ENABLED: "false"
      TZ: Europe/Moscow
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: artship-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ""
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  postgres-data:
  frontend-node-modules:
